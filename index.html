<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Periodic Table Adventure 🧪 مغامرة الجدول الدوري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#e8f5f1;--bg2:#cfeee6;--panel:#ffffff;--panel2:#eff8f5;--ink:#14243a;--muted:#587178;--accent:#0b9a88;--accent2:#6a4df0;--good:#119a56;--bad:#dc3a42;--warn:#e8920c;--line:#c3dbd5;--sh:0 6px 18px rgba(20,36,58,.12);--on:#fff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e24;--bg2:#17205a;--panel:#141b3c;--panel2:#1c2552;--ink:#e9efff;--muted:#a3b2dc;--accent:#2fd9c2;--accent2:#a592ff;--good:#41df8a;--bad:#ff6c75;--warn:#ffbe4a;--line:#2d3a73;--sh:0 8px 22px rgba(0,0,0,.45);--on:#07122b}}
:root[data-theme="dark"]{--bg:#0a0e24;--bg2:#17205a;--panel:#141b3c;--panel2:#1c2552;--ink:#e9efff;--muted:#a3b2dc;--accent:#2fd9c2;--accent2:#a592ff;--good:#41df8a;--bad:#ff6c75;--warn:#ffbe4a;--line:#2d3a73;--sh:0 8px 22px rgba(0,0,0,.45);--on:#07122b}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
html,body{margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:radial-gradient(900px 520px at 85% -8%,var(--bg2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.6;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
#bgat{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bgat i{position:absolute;border-radius:50%;border:2px solid var(--accent);opacity:.12;animation:flt 14s ease-in-out infinite}
@keyframes flt{50%{transform:translate(18px,-26px) scale(1.08)}}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .pg{flex:1;height:10px;background:var(--panel2);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
#top .pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.ib{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:4px 10px;font-weight:800;font-size:.9rem}
.xpc{font-weight:800;color:var(--warn);font-size:.9rem;white-space:nowrap}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:12px 12px 130px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
h2{font-size:1.25rem;font-weight:800}h2 small{font-size:.8rem;color:var(--muted);font-weight:600;direction:ltr;display:inline-block}
h3{font-size:1.05rem;font-weight:800;margin-bottom:6px}
.mini{font-size:.85rem;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:10px 16px;background:var(--accent);color:var(--on);font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.big{font-size:1.45rem;padding:16px 38px;border-radius:22px;background:linear-gradient(135deg,var(--accent2),var(--accent));animation:pls 2s infinite}
.btn[disabled]{opacity:.4;pointer-events:none}
@keyframes pls{50%{transform:scale(1.05)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700}
.zhead{display:flex;justify-content:space-between;align-items:center;font-size:1.15rem;font-weight:800;margin:4px 2px 10px}
.task{font-size:.98rem;margin-bottom:8px}
.fb{margin-top:10px;min-height:46px;border-radius:14px;padding:10px 12px;background:var(--panel2);border:1px dashed var(--line);font-size:.92rem}
.fb.good{border:2px solid var(--good)}.fb.bad{border:2px solid var(--bad)}.fb.warn{border:2px solid var(--warn)}.fb.hint{border:2px solid var(--accent2)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.tab{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:.85rem}
.tab.on{background:var(--accent2);color:var(--on);border-color:var(--accent2)}.tab.lock{opacity:.4}
.tr{margin:6px 0 0;padding:0 18px;font-size:.92rem}.tr li{margin-bottom:3px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 12px;font-weight:800}
.chip.on{background:var(--accent);color:var(--on)}
/* hero */
.hero{text-align:center;padding:26px 8px 10px;position:relative;z-index:1;max-width:760px;margin:0 auto}
.hero h1{font-size:clamp(1.9rem,8vw,3.1rem);font-weight:800;line-height:1.15;direction:ltr;background:linear-gradient(90deg,var(--accent2),var(--accent),var(--warn));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:10px auto 16px;max-width:30em;color:var(--muted)}
.mini-pt{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;direction:ltr;margin:14px 6px}
.mini-pt b{aspect-ratio:1;border-radius:3px;font-size:clamp(5px,1.6vw,10px);display:grid;place-items:center;color:#fff;font-weight:800;animation:hue 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*70ms)}
.mini-pt u{aspect-ratio:1}
@keyframes hue{50%{filter:hue-rotate(110deg) brightness(1.25);transform:scale(1.12)}}
/* periodic table */
.scr{overflow-x:auto;padding-bottom:4px;direction:ltr}
.tw{position:relative;min-width:560px;padding:18px 0 0 18px;direction:ltr}
.pt{display:grid;grid-template-columns:repeat(18,minmax(26px,1fr));gap:2px}
.cell{border:2px solid transparent;border-radius:5px;height:32px;padding:0;color:#fff;font-weight:800;font-size:.72rem;text-shadow:0 1px 2px rgba(0,0,0,.4);transition:transform .15s}
.cell.sel{border-color:var(--ink);transform:scale(1.18);position:relative;z-index:2}
.cell.sel2{border-color:var(--warn);transform:scale(1.18);position:relative;z-index:2}
.gap{font-size:.62rem;color:var(--muted);display:grid;place-items:center}
.ah{position:absolute;top:0;left:18px;right:0;height:14px;display:flex;align-items:center}
.av{position:absolute;left:0;top:18px;bottom:0;width:14px;display:flex;flex-direction:column;align-items:center}
.ah i{flex:1;height:5px;background:repeating-linear-gradient(90deg,var(--accent2) 0 10px,transparent 10px 18px);background-size:18px 5px;animation:flR .8s linear infinite}
.ah.L i{animation-name:flL}
.av i{flex:1;width:5px;background:repeating-linear-gradient(180deg,var(--accent2) 0 10px,transparent 10px 18px);background-size:5px 18px;animation:fdD .8s linear infinite}
.av.U i{animation-name:fdU}
@keyframes flR{to{background-position-x:18px}}@keyframes flL{to{background-position-x:-18px}}
@keyframes fdD{to{background-position-y:18px}}@keyframes fdU{to{background-position-y:-18px}}
.ah b,.av b{width:0;height:0;border:7px solid transparent;flex:none}
.hr{border-left-color:var(--accent2)!important;border-right-width:0!important}.hl{border-right-color:var(--accent2)!important;border-left-width:0!important}
.hd{border-top-color:var(--accent2)!important;border-bottom-width:0!important}.hu{border-bottom-color:var(--accent2)!important;border-top-width:0!important}
.legend{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);margin-top:6px}
.legend i{flex:1;height:8px;border-radius:6px;background:linear-gradient(90deg,hsl(230 75% 50%),hsl(130 75% 46%),hsl(30 75% 50%))}
.info{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--panel2);font-size:.9rem;border:1px solid var(--line)}
.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-areas:". u ." "l . r" ". d .";gap:4px;direction:ltr}
.dpad button{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:800}
.dpad [data-d=U]{grid-area:u}.dpad [data-d=L]{grid-area:l}.dpad [data-d=R]{grid-area:r}.dpad [data-d=D]{grid-area:d}
.stage{display:flex;gap:10px;align-items:center;justify-content:space-around;flex-wrap:wrap}
.meter{height:14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--warn));transition:width .8s}
/* atoms */
.atom{--px:62px;--h:200;width:var(--px);height:var(--px);border-radius:50%;display:grid;place-content:center;text-align:center;color:#fff;cursor:grab;user-select:none;touch-action:none;background:radial-gradient(circle at 32% 28%,hsl(var(--h) 85% 72%),hsl(var(--h) 70% 42%));box-shadow:0 5px 12px rgba(0,0,0,.25);position:relative;flex:none;transition:width .5s,height .5s}
.atom b{font-size:calc(var(--px)*.34);line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.atom small{font-size:calc(var(--px)*.17);line-height:1.1}
.atom.sm small{display:none}
.atom.sel{outline:4px solid var(--warn)}
.atom.new{animation:grow .7s cubic-bezier(.3,1.6,.5,1)}
.atom .sh{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.7rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 6px;white-space:nowrap}
@keyframes grow{from{transform:scale(.4)}}
.forest{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:18px 8px 26px;border-radius:16px;min-height:100px;background:linear-gradient(180deg,rgba(60,170,90,.12),rgba(60,170,90,.28));border:1px solid var(--line)}
.trail{display:flex;gap:6px;justify-content:center;align-items:flex-end;margin-top:12px;padding:10px 0 0;border-bottom:6px solid var(--good);border-radius:0 0 8px 8px}
.slot{border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;position:relative;background:var(--panel2);flex:none}
.slot .no{position:absolute;top:2px;right:6px;font-weight:800;color:var(--muted);font-size:.8rem}
.slot em{font-size:.68rem;color:var(--muted);font-style:normal;margin-top:4px}
.drop.over{outline:3px dashed var(--accent2);background:var(--panel)}
.ghost{filter:drop-shadow(0 10px 12px rgba(0,0,0,.35));opacity:.95}
.lifted{opacity:.25}
.shake{animation:shk .45s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.cmp{display:flex;gap:16px;justify-content:center;align-items:flex-end;margin:10px 0 14px}
.cmp>div{text-align:center;font-size:.8rem}
/* z2 */
.bat{position:relative;height:30px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);overflow:hidden;margin:8px 0}
.bat i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--good),var(--warn));transition:width .7s}
.bat span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.85rem;direction:ltr}
.lamps{display:flex;gap:10px;justify-content:center;margin:10px 0}
.lamp{flex:1;max-width:130px;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:8px 4px;font-size:1.8rem;background:var(--panel2)}
.lamp small{display:block;font-size:.7rem;color:var(--muted);line-height:1.2}
.lamp.on{border:2px solid var(--warn);box-shadow:0 0 22px var(--warn);animation:pop .5s}
@keyframes pop{from{transform:scale(.8)}}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:10px}
.acard{text-align:center;padding:14px 4px 6px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);font-size:.8rem;cursor:pointer}
.acard.used{opacity:.55}
.nuc{position:relative;width:58px;height:58px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:radial-gradient(circle at 32% 28%,hsl(var(--h) 85% 70%),hsl(var(--h) 70% 40%))}
.orbit{position:absolute;inset:-12px;border:1px dashed var(--muted);border-radius:50%;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.el{position:absolute;top:-7px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px var(--warn);cursor:grab;touch-action:none}
.el::after{content:'';position:absolute;inset:-20px}
.el.free{position:relative;top:0;left:0;margin:0;display:inline-block}
/* z3 */
.socks{display:flex;gap:10px}
.sock{flex:1;min-height:70px;border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2);position:relative;cursor:pointer}
.sock b{font-size:1.4rem}.sock small{font-size:.75rem;color:var(--muted)}
.sock .x{position:absolute;top:2px;left:4px;border:0;background:transparent;font-weight:800;color:var(--bad)}
.bond{width:100%;max-height:170px;margin-top:6px}
.bond .rope{stroke:var(--muted);stroke-width:5;stroke-dasharray:8 6}
.bond .cloud{transition:transform .9s cubic-bezier(.4,1.3,.5,1),opacity .4s;transform-box:fill-box}
.bond .cl{fill:var(--accent2);opacity:.45}
.bond .ed{fill:var(--warn)}
.bond text{font-family:inherit;font-weight:800;text-anchor:middle;fill:#fff;font-size:18px}
.bond .dl{fill:var(--ink);font-size:16px}
.bond circle.bA,.bond circle.bB{transition:r .4s}
.escale{position:relative;height:26px;direction:ltr;margin:6px 6px 0;border-top:4px solid var(--line)}
.escale i{position:absolute;top:-12px;width:20px;height:20px;border-radius:50%;margin-left:-10px;transition:left .6s}
.escale .a{background:var(--accent)}.escale .b{background:var(--warn)}
.escale span{position:absolute;top:10px;font-size:.7rem;color:var(--muted)}
.binfo{margin-top:6px;font-size:.88rem;background:var(--panel2);border-radius:12px;padding:8px 10px;border:1px solid var(--line)}
.bench{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.tok{--h:200;width:60px;padding:6px 2px;text-align:center;border-radius:14px;color:#fff;font-weight:800;cursor:grab;touch-action:none;user-select:none;background:linear-gradient(160deg,hsl(var(--h) 75% 55%),hsl(var(--h) 65% 38%));box-shadow:0 3px 8px rgba(0,0,0,.25)}
.tok b{display:block;font-size:1.2rem;line-height:1.1}.tok small{font-size:.65rem;font-weight:600;display:block;line-height:1.2}
.tok.sel{outline:4px solid var(--warn)}
/* z4 */
.beakers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.beaker{border:2px solid var(--line);border-radius:6px 6px 18px 18px;padding:8px 2px;text-align:center;background:var(--panel2);font-weight:800;cursor:pointer;min-height:72px}
.beaker small{display:block;font-weight:600;font-size:.7rem}
.beaker.rel{background:linear-gradient(180deg,var(--panel2),rgba(30,200,120,.4));border-color:var(--good)}
.beaker.rej{background:linear-gradient(180deg,var(--panel2),rgba(230,60,70,.35));border-color:var(--bad)}
.esrc{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:16px;background:var(--panel2);border:2px solid var(--warn);font-weight:800;cursor:grab;touch-action:none;user-select:none}
.gauge{flex:1;min-width:150px}
.gl{height:16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.gl i{display:block;height:100%;animation:fillw .9s ease}
@keyframes fillw{from{width:0}}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bin{min-height:110px;border:2px dashed var(--line);border-radius:14px;padding:6px;font-size:.78rem;font-weight:700;background:var(--panel2);text-align:center}
.bin .tok{display:inline-block;margin:2px;width:50px;cursor:default}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:6px;direction:ltr}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;font-size:.72rem}
.bar i{width:72%;background:var(--accent);border-radius:6px 6px 0 0;transition:height .6s}
.bar.hl i{background:var(--warn)}.bar.on i{background:var(--accent2)}
.bar b{margin-top:3px}
.orbs{display:flex;gap:10px;justify-content:center;direction:ltr;flex-wrap:wrap}
.orbs>div{text-align:center;font-size:.72rem}
.ob{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--ink);margin:1px;font-weight:800;font-size:.85rem;border-radius:4px;letter-spacing:-2px}
.opt{display:block;width:100%;text-align:right;margin-top:8px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-weight:600;font-size:.9rem}
.opt.ok{border-color:var(--good)}.opt.no{border-color:var(--bad);opacity:.6}
/* z5 */
.gwrap{position:relative;direction:ltr;aspect-ratio:8/6;border-radius:14px;overflow:hidden;border:2px solid var(--line);transition:filter 1s}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr)}
.tile{display:grid;place-items:center;border:1px solid rgba(255,255,255,.08);background:linear-gradient(135deg,#34506c,#2a3f58);font-size:clamp(14px,4.4vw,26px);cursor:pointer;position:relative}
.tile:nth-child(odd){background:linear-gradient(135deg,#2f4863,#26394f)}
.tile.rock{background:#1b2535;cursor:not-allowed}
.smp{--h:200;width:78%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:.62em;background:hsl(var(--h) 70% 48%);box-shadow:0 0 10px hsl(var(--h) 90% 60%);animation:pls 1.6s infinite}
.stn{filter:grayscale(1)}.stn.lit{filter:none;animation:pop .6s}
#robot{position:absolute;width:12.5%;height:16.6667%;display:grid;place-items:center;font-size:clamp(16px,5vw,30px);transition:left .15s,top .15s;pointer-events:none;z-index:3}
.inv{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:36px}
.inv .tok{width:50px;cursor:pointer}
.tslot{min-height:56px;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--muted);margin:8px 0;font-weight:700}
.seq{display:flex;gap:4px;flex-wrap:wrap;direction:rtl;min-height:44px;border:2px dashed var(--line);border-radius:14px;padding:4px}
.seq .tok{width:46px;cursor:default}
/* reactor */
.core{height:120px;display:grid;place-items:center;position:relative;--g:0}
.core .ring{position:absolute;border-radius:50%;border:4px solid var(--accent2);border-top-color:transparent;animation:spin calc(8s - var(--g)*1.4s) linear infinite}
.core .r1{width:110px;height:110px}.core .r2{width:78px;height:78px;border-color:var(--warn);border-bottom-color:transparent;animation-direction:reverse}
.core .nuc2{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:radial-gradient(circle,var(--warn),var(--bad));box-shadow:0 0 calc(8px + var(--g)*14px) var(--warn);filter:saturate(calc(.3 + var(--g)*.14));animation:flk 1s infinite}
@keyframes flk{50%{opacity:.75}}
.core.boom{animation:shk .5s}
.core.up .nuc2{animation:none;box-shadow:0 0 60px var(--good);background:radial-gradient(circle,#fff,var(--good))}
.mods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mod{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px 2px;text-align:center;font-size:.7rem;line-height:1.2}
.mod span{font-size:1.4rem;display:block}.mod b{display:block;font-size:1rem}
.mod.act{border-color:var(--accent2)}.mod.ok{border-color:var(--good);background:var(--panel)}.mod.bad{border-color:var(--bad);animation:shk .45s}
.cond{margin-top:10px;font-size:.9rem;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
/* map */
.mapwrap{position:relative;height:470px;direction:ltr;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.mpath{fill:none;stroke:var(--accent2);stroke-width:3;stroke-dasharray:2 2.4;vector-effect:non-scaling-stroke;opacity:.7}
.node{position:absolute;transform:translate(-50%,-50%);width:78px;text-align:center;border:0;background:transparent;font-size:.72rem;font-weight:800;line-height:1.2;direction:rtl}
.node span{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 2px;border-radius:50%;font-size:1.9rem;background:var(--panel);border:3px solid var(--accent);box-shadow:var(--sh)}
.node.open span{animation:pls 1.8s infinite}.node.done span{border-color:var(--good);background:var(--panel2)}
.node.lock{opacity:.5}.node.lock span{border-color:var(--line);filter:grayscale(1)}
/* misc */
#mascot{position:fixed;z-index:40;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border:0;background:transparent;padding:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
#mascot .e{transform-origin:30px 30px;animation:spin 4s linear infinite}
#bubble{position:fixed;z-index:40;right:74px;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:min(72vw,360px);background:var(--panel);border:2px solid var(--accent2);border-radius:16px;padding:8px 12px;font-size:.85rem;box-shadow:var(--sh);opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}
#bubble.on{opacity:1;transform:none}
#modal{position:fixed;inset:0;z-index:60;background:rgba(5,10,30,.6);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:24px;padding:20px;max-width:430px;width:100%;text-align:center;box-shadow:var(--sh);border:2px solid var(--accent2);animation:pop .4s;max-height:90vh;overflow:auto}
.mbox h2{margin-bottom:8px}.mbox p{margin-bottom:12px;color:var(--muted)}
.xpf{position:fixed;z-index:70;left:50%;top:30%;transform:translateX(-50%);font-weight:800;font-size:1.5rem;color:var(--warn);animation:xp 1.3s forwards;pointer-events:none}
@keyframes xp{to{transform:translate(-50%,-70px);opacity:0}}
#toast{position:fixed;z-index:80;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-weight:700;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
.skills{list-style:none;padding:0;margin:8px 0;text-align:right}.skills li{padding:4px 0}
.cf{position:fixed;top:-20px;z-index:65;font-size:1.4rem;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
</style>
</head>
<body>
<div id="bgat"></div>
<header id="top" class="hidden">
 <button class="ib" id="bMap" title="الخريطة">🗺</button>
 <button class="ib" id="bLes" title="مراجعة الدروس">📖</button>
 <div class="pg"><i id="pgi"></i></div>
 <span class="xpc">⭐ <span id="xp">0</span> · م<span id="lv">1</span></span>
 <button class="ib" id="bSnd" title="الصوت">🔊</button>
</header>
<main id="app"></main>
<div id="bubble"></div>
<button id="mascot" aria-label="اطلب تلميحًا من أتوم">
 <svg viewBox="0 0 60 60"><g class="e"><ellipse cx="30" cy="30" rx="29" ry="11" fill="none" stroke="#ffb52e" stroke-width="2"/><circle cx="59" cy="30" r="3.2" fill="#ffb52e"/></g><circle cx="30" cy="30" r="20" fill="#6a4df0"/><circle cx="23" cy="27" r="4.2" fill="#fff"/><circle cx="37" cy="27" r="4.2" fill="#fff"/><circle cx="24" cy="28" r="2" fill="#14243a"/><circle cx="38" cy="28" r="2" fill="#14243a"/><path d="M22 36 Q30 43 38 36" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
</button>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
let S={xp:0,done:{},lessonsDone:false,muted:false},cur='start',hintFn=null;
try{const v=JSON.parse(localStorage.getItem('pta_v2')||'null');if(v)S=Object.assign(S,v)}catch(e){}
const save=()=>{try{localStorage.setItem('pta_v2',JSON.stringify(S))}catch(e){}};
const rnd=a=>[...a].sort(()=>Math.random()-.5);

/* ===== البيانات: z|رمز|اسم|مجموعة|دورة|نصف قطر pm|طاقة تأين kJ/mol|كهروسالبية|ألفة إلكترونية (سالب = تُطلق طاقة) ===== */
const RAW=`1|H|هيدروجين|1|1|53|1312|2.20|-73
2|He|هيليوم|18|1|31|2372||21
3|Li|ليثيوم|1|2|167|520|0.98|-60
4|Be|بريليوم|2|2|112|900|1.57|0
5|B|بورون|13|2|87|801|2.04|-27
6|C|كربون|14|2|67|1086|2.55|-122
7|N|نيتروجين|15|2|56|1402|3.04|7
8|O|أكسجين|16|2|48|1314|3.44|-141
9|F|فلور|17|2|42|1681|3.98|-328
10|Ne|نيون|18|2|38|2081||29
11|Na|صوديوم|1|3|190|496|0.93|-53
12|Mg|مغنيسيوم|2|3|145|738|1.31|0
13|Al|ألومنيوم|13|3|118|578|1.61|-42
14|Si|سيليكون|14|3|111|787|1.90|-134
15|P|فوسفور|15|3|98|1012|2.19|-72
16|S|كبريت|16|3|88|1000|2.58|-200
17|Cl|كلور|17|3|79|1251|3.16|-349
18|Ar|أرغون|18|3|71|1521||35
19|K|بوتاسيوم|1|4|243|419|0.82|-48
20|Ca|كالسيوم|2|4|194|590|1.00|2
31|Ga|غاليوم|13|4|136|579|1.81|-41
32|Ge|جرمانيوم|14|4|125|762|2.01|-119
33|As|زرنيخ|15|4|114|947|2.18|-78
34|Se|سيلينيوم|16|4|103|941|2.55|-195
35|Br|بروم|17|4|94|1140|2.96|-325
36|Kr|كريبتون|18|4|88|1351||39
37|Rb|روبيديوم|1|5|265|403|0.82|-47
38|Sr|سترونشيوم|2|5|219|550|0.95|5
49|In|إنديوم|13|5|156|558|1.78|-37
50|Sn|قصدير|14|5|145|709|1.96|-107
51|Sb|أنتيمون|15|5|133|834|2.05|-103
52|Te|تيلوريوم|16|5|123|869|2.10|-190
53|I|يود|17|5|115|1008|2.66|-295
54|Xe|زينون|18|5|108|1170||41
55|Cs|سيزيوم|1|6|298|376|0.79|-46
56|Ba|باريوم|2|6|253|503|0.89|-14`;
const E={},ELS=[],G={};
RAW.trim().split('\n').forEach(l=>{const a=l.split('|');const e={z:+a[0],s:a[1],n:a[2],g:+a[3],p:+a[4],r:+a[5],ie:+a[6],en:a[7]===''?null:+a[7],ea:+a[8]};E[e.s]=e;ELS.push(e);(G[e.p]=G[e.p]||{})[e.g]=e});
const CATH={alk:8,ae:34,met:205,mtd:165,nm:100,hal:285,ng:190};
function cat(e){if(e.g==18)return'ng';if(e.g==17)return'hal';if(e.s=='H')return'nm';if(e.g==1)return'alk';if(e.g==2)return'ae';if(['B','Si','Ge','As','Sb','Te'].includes(e.s))return'mtd';if(['Al','Ga','In','Sn'].includes(e.s))return'met';return'nm'}
const hue=e=>CATH[cat(e)];
const kind=e=>{const c=cat(e);return['alk','ae','met'].includes(c)?'فلز':c=='mtd'?'شبه فلز':'لا فلز'};
const PR={
 r:{ar:'نصف القطر الذري',en:'Atomic Radius',ic:'⭕',get:e=>e.r,show:e=>e.r+' pm',a:'L',d:'D'},
 ie:{ar:'طاقة التأين',en:'Ionization Energy',ic:'⚡',get:e=>e.ie,show:e=>e.ie+' kJ/mol',a:'R',d:'U'},
 en:{ar:'الكهروسالبية',en:'Electronegativity',ic:'🧲',get:e=>e.en,show:e=>e.en==null?'— (غاز نبيل: لا يكوّن روابط عادةً)':e.en.toFixed(2),a:'R',d:'U'},
 ea:{ar:'الألفة الإلكترونية',en:'Electron Affinity',ic:'🔬',get:e=>Math.max(0,-e.ea),show:e=>e.ea<0?'−'+(-e.ea)+' kJ/mol (تُطلق طاقة)':'≈ 0 أو موجبة (+'+e.ea+')',a:'R',d:'U'},
 mc:{ar:'الصفة الفلزية',en:'Metallic Character',ic:'🔩',get:e=>e.en==null?null:(4-e.en)*25,show:e=>kind(e)+(e.en==null?' (خامل)':' · '+Math.round((4-e.en)*25)+'/100'),a:'L',d:'D'}
};
const KEYS=['r','ie','en','ea','mc'];
KEYS.forEach(k=>{const v=ELS.map(PR[k].get).filter(x=>x!=null);PR[k].mn=Math.min(...v);PR[k].mx=Math.max(...v)});
const val=(k,e)=>PR[k].get(e);
function nb(e,d){const sg=(d=='L'||d=='U')?-1:1;
 if(d=='L'||d=='R'){for(let g=e.g+sg;g>=1&&g<=18;g+=sg)if(G[e.p]&&G[e.p][g])return G[e.p][g]}
 else{for(let p=e.p+sg;p>=1&&p<=6;p+=sg)if(G[p]&&G[p][e.g])return G[p][e.g]}
 return null}

/* ===== أدوات عامة ===== */
let ac;
function sfx(t){if(S.muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const M={good:[660,880],bad:[240,170],pick:[420],drop:[520],win:[523,659,784,1047],zap:[300,700]}[t]||[440];M.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+i*.1;o.type=t=='bad'?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t0);g.gain.exponentialRampToValueAtTime(.12,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+.16);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+.18)})}catch(e){}}
function say(t,ms=7000){const b=$('#bubble');b.innerHTML=t;b.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>b.classList.remove('on'),ms)}
function toast(t){const b=$('#toast');b.textContent=t;b.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>b.classList.remove('on'),1800)}
function fb(h,c=''){const f=$('#fb');if(!f)return;f.className='fb '+c;f.innerHTML=h}
function shake(n){if(!n)return;n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake')}
function prog(){return((S.lessonsDone?1:0)+Object.keys(S.done).length)/7}
function updTop(){$('#xp').textContent=S.xp;$('#lv').textContent=Math.floor(S.xp/100)+1;$('#pgi').style.width=Math.round(prog()*100)+'%';$('#bSnd').textContent=S.muted?'🔇':'🔊'}
function addXP(n){S.xp+=n;save();updTop();const f=document.createElement('div');f.className='xpf';f.textContent='+'+n+' XP ✨';document.body.appendChild(f);setTimeout(()=>f.remove(),1400)}
function modal(h){const m=$('#modal');m.innerHTML='<div class="mbox">'+h+'</div>';m.classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
function finish(key,xp,title,msg){const first=!S.done[key];S.done[key]=1;save();if(first)addXP(xp);sfx('win');confetti();updTop();
 modal(`<h2>🎊 ${title}</h2><p>${msg}</p><div class="row" style="justify-content:center"><button class="btn" id="mb">${key=='rx'?'🌟 إلى النهاية':'🗺 العودة للخريطة'}</button></div>`);$('#mb').onclick=()=>go(key=='rx'?'win':'map')}
function confetti(){for(let i=0;i<26;i++){const c=document.createElement('div');c.className='cf';c.textContent=['⚛️','✨','🧪','⭐','🔹'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDuration=(1.6+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}}
/* سحب وإفلات بالمؤشر — يعمل بالفأرة واللمس */
function under(e){for(const n of document.elementsFromPoint(e.clientX,e.clientY)){const d=n.closest&&n.closest('.drop');if(d)return d}return null}
function drag(node,data,o){
 node.style.touchAction='none';
 node.addEventListener('pointerdown',ev=>{
  if(ev.button>0)return;ev.preventDefault();
  const sx=ev.clientX,sy=ev.clientY,r=node.getBoundingClientRect(),ox=sx-r.left,oy=sy-r.top;let moved=false,gh=null;
  const mv=e=>{
   if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>7){moved=true;gh=node.cloneNode(true);gh.classList.add('ghost');gh.removeAttribute('id');
    Object.assign(gh.style,{position:'fixed',left:'0',top:'0',width:r.width+'px',height:r.height+'px',margin:'0',zIndex:'999',pointerEvents:'none'});document.body.appendChild(gh);node.classList.add('lifted');sfx('pick')}
   if(moved){gh.style.transform=`translate(${e.clientX-ox}px,${e.clientY-oy}px) scale(1.08)`;$$('.drop.over').forEach(x=>x.classList.remove('over'));const t=under(e);if(t)t.classList.add('over')}};
  const up=e=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
   $$('.drop.over').forEach(x=>x.classList.remove('over'));node.classList.remove('lifted');
   if(!moved){o.onTap&&o.onTap(data,node);return}
   gh.remove();const t=e.type=='pointercancel'?null:under(e);if(t)o.onDrop&&o.onDrop(data,t);else o.onMiss&&o.onMiss(data)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)})}
function bars(items,o={}){const mx=o.max||Math.max(...items.map(i=>Math.abs(i[1])));
 return`<div class="bars">${items.map(([k,v,t])=>`<div class="bar ${(o.hl||[]).includes(k)?'hl':''} ${o.on===k?'on':''}" data-k="${k}"><small>${t==null?v:t}</small><i style="height:${Math.max(3,Math.abs(v)/mx*100*.78)}%"></i><b>${k}</b></div>`).join('')}</div>`}

/* ===== الجدول الدوري ===== */
function cellH(e,prop){let st;if(!prop)st=`background:hsl(${hue(e)} 55% 40%)`;else{const P=PR[prop],v=P.get(e);if(v==null)st='background:var(--panel2);color:var(--muted);text-shadow:none';else{const t=(v-P.mn)/(P.mx-P.mn||1);st=`background:hsl(${230-200*t} 75% ${44+6*(1-t)}%)`}}return`<button class="cell" data-s="${e.s}" style="${st}" title="${e.n}">${e.s}</button>`}
function ptHTML(prop){let h='<div class="pt">';for(let p=1;p<=6;p++){let g=1;while(g<=18){const e=G[p]&&G[p][g];if(e){h+=cellH(e,prop);g++}else{let t=g;while(t<=18&&!(G[p]&&G[p][t]))t++;h+=`<div class="gap" style="grid-column:${g}/span ${t-g}">${(p==4||p==5)&&g==3?'فلزات انتقالية':''}</div>`;g=t}}}return h+'</div>'}
function arrows(k){const a=PR[k].a,d=PR[k].d;
 return`<div class="ah ${a}">${a=='R'?'<i></i><b class="hr"></b>':'<b class="hl"></b><i></i>'}</div><div class="av ${d}">${d=='D'?'<i></i><b class="hd"></b>':'<b class="hu"></b><i></i>'}</div>`}

/* ===== الدروس ===== */
const LESS={
 r:{def:'<b>نصف القطر الذري</b> يصف حجم الذرة: المسافة التقريبية من النواة إلى أبعد إلكترونات في الغلاف الخارجي.',
  tr:['↔ <b>عبر الدورة</b> (يسار ← يمين): يقل، لأن الشحنة النووية تزداد وتشدّ الإلكترونات نحو النواة.','↕ <b>نزولًا في المجموعة</b>: يزداد، لأن كل دورة جديدة تضيف غلافًا بعيدًا.','مثال: السيزيوم Cs من أكبر الذرات، والفلور F من أصغرها.']},
 ie:{def:'<b>طاقة التأين الأولى</b> هي الطاقة اللازمة لنزع أضعف إلكترون ارتباطًا من ذرة غازية معزولة.',
  tr:['↔ <b>عبر الدورة</b>: تزداد عمومًا (الإلكترون أقرب والجذب أقوى).','↕ <b>نزولًا في المجموعة</b>: تقل (الإلكترون الخارجي أبعد ويسهل نزعه).','⚠ استثناءات: Be أعلى من B، وN أعلى من O.']},
 en:{def:'<b>الكهروسالبية</b> هي قدرة الذرة على جذب إلكترونات الرابطة الكيميائية نحوها داخل الجزيء.',
  tr:['↔ <b>عبر الدورة</b>: تزداد.','↕ <b>نزولًا في المجموعة</b>: تقل.','الفلور F الأعلى (3.98) والسيزيوم Cs من الأقل. الغازات النبيلة لا تُعطى قيمة عادةً.','تختلف عن طاقة التأين: هذه لذرة معزولة، وتلك لذرة داخل رابطة.']},
 ea:{def:'<b>الألفة الإلكترونية</b> هي التغير في الطاقة عند اكتساب ذرة غازية إلكترونًا. القيمة السالبة تعني أن الطاقة <b>تُطلق</b>.',
  tr:['اتجاه عام: تُطلق طاقة أكبر نحو اليمين وللأعلى.','⚠ <b>استثناءات كثيرة</b>: Be وMg وN وNe وAr لا ترحّب بإلكترون جديد.','⚠ وكلور Cl أكبر من فلور F، لأن F صغيرة جدًا فيزداد التنافر.']},
 mc:{def:'<b>الصفة الفلزية</b> هي ميل العنصر لفقد الإلكترونات وإظهار خواص الفلزات: لمعان، توصيل جيد، وقابلية للطرق.',
  tr:['↔ <b>عبر الدورة</b>: تقل (من فلز إلى لا فلز).','↕ <b>نزولًا في المجموعة</b>: تزداد.','أشباه الفلزات (B, Si, Ge, As, Sb, Te) على الحد الفاصل.']}
};
const WHY={
 r:{D:'نزلنا في المجموعة ⇒ أُضيف غلاف جديد ⇒ الذرة أكبر.',U:'صعدنا ⇒ غلاف أقل ⇒ الذرة أصغر.',R:'عدد الأغلفة ثابت لكن الشحنة النووية زادت ⇒ تقترب الإلكترونات من النواة ⇒ الذرة أصغر.',L:'شحنة نووية أقل ⇒ جذب أضعف ⇒ الذرة أكبر.'},
 ie:{R:'شحنة نووية فعّالة أكبر ونصف قطر أصغر ⇒ الإلكترون أشد ارتباطًا ⇒ طاقة أكبر.',L:'جذب أضعف ⇒ نزع أسهل ⇒ طاقة أقل.',D:'الإلكترون الخارجي أبعد ومحجوب بأغلفة أكثر ⇒ ينتزع بسهولة ⇒ طاقة أقل.',U:'الإلكترون أقرب للنواة ⇒ نزعه أصعب ⇒ طاقة أكبر.'},
 en:{R:'شحنة نووية فعّالة أكبر ⇒ جذب أقوى لإلكترونات الرابطة.',L:'جذب أضعف لإلكترونات الرابطة.',D:'الإلكترونات بعيدة عن النواة ⇒ جذب أضعف.',U:'ذرة أصغر ⇒ تجذب إلكترونات الرابطة بقوة أكبر.'},
 ea:{R:'اتجاه عام: تميل الذرة أكثر لاكتساب الإلكترون فتُطلق طاقة أكبر.',L:'ميل أقل لاكتساب الإلكترون.',D:'الإلكترون الجديد يدخل غلافًا أبعد ⇒ طاقة أقل تُطلق (في الغالب).',U:'الإلكترون الجديد أقرب للنواة ⇒ طاقة أكبر (في الغالب).'},
 mc:{R:'تتمسك الذرة بإلكتروناتها أكثر ⇒ الصفة الفلزية تقل.',L:'تفقد الذرة إلكتروناتها بسهولة أكبر ⇒ الصفة الفلزية تزداد.',D:'الإلكترون الخارجي أبعد ⇒ يسهل فقده ⇒ الصفة الفلزية تزداد.',U:'فقد الإلكترون أصعب ⇒ الصفة الفلزية تقل.'}
};

function bump(k){L.cnt[k]=(L.cnt[k]||0)+1;if(L.cnt[k]>=2){const n=$('#next');if(n)n.disabled=false;const h=$('#nh');if(h)h.textContent='✅ أحسنت! يمكنك المتابعة'}else{const h=$('#nh');if(h&&!S.lessonsDone)h.textContent='🔒 تفاعل واحد آخر على الأقل...'}}

 };

function labUpd(k,act){
 const e=E[L.sel],why=L.mv&&WHY[k][L.mv]?'<br>💡 '+WHY[k][L.mv]:'';
 if(k=='r'){const s=e.r/298,ac=$('#ac');$('#ag').style.transform=`scale(${s})`;ac.setAttribute('fill',`hsl(${hue(e)} 70% 55%)`);ac.setAttribute('stroke',`hsl(${hue(e)} 70% 40%)`);

 if(k=='ie'){$('#isym').textContent=e.s;$('#inuc').style.background=`radial-gradient(circle at 32% 28%,hsl(${hue(e)} 85% 70%),hsl(${hue(e)} 70% 40%))`;$('#iel').style.display='';$('#ifill').style.width='0';$('#ival').textContent='—';
  $('#lt').innerHTML=`<b>${e.n}</b>: اسحب الإلكترون الخارجي لتعرف الطاقة. ${why}`}
 if(k=='en'){const A=E[L.sel],B=E[L.sel2];$('#p0').textContent=A.s;$('#p1').textContent=B.s;$$('[data-pk]').forEach(b=>b.classList.toggle('on',+b.dataset.pk==L.pick));
  const r=bondUpd($('#lab'),A,B);
  $('#lt').innerHTML=r?`ΔEN = <b>${r.d.toFixed(2)}</b> ⇒ رابطة <b>${r.t}</b>.<br>الإلكترونات أقرب إلى <b>${r.hi.n}</b> (${r.hi.en.toFixed(2)}).${why}`:'اختر ذرتين لهما قيمة كهروسالبية (الغازات النبيلة لا تكوّن روابط عادةً).';

 if(k=='mc'){const sc=e.en==null?0:(4-e.en)*25,kd=kind(e),P=kd=='فلز'?[92,95,90]:kd=='شبه فلز'?[60,45,12]:[8,2,4];

  $('#mm').style.width=sc+'%';$('#m1').style.width=P[0]+'%';$('#m2').style.width=P[1]+'%';$('#m3').style.width=P[2]+'%';
  $('#lt').innerHTML=`<b>${e.n}</b> ${e.en==null?'غاز نبيل خامل.':'درجة الصفة الفلزية '+Math.round(sc)+'/100.'}${why}`;}
 if(act&&(k=='r'||k=='mc'))bump(k)}
function ieRemove(){const e=E[L.sel];sfx('zap');$('#iel').style.display='none';$('#ifill').style.width=Math.min(100,e.ie/2100*100)+'%';$('#ival').textContent=e.ie+' kJ/mol';

function eaFire(){const e=E[L.sel],f=$('#efill');sfx(e.ea<0?'good':'bad');
 if(e.ea<0){f.style.background='linear-gradient(90deg,var(--good),var(--warn))';f.style.width=Math.min(100,-e.ea/350*100)+'%';$('#enuc').style.boxShadow='0 0 28px var(--warn)'}

/* --- رابطة (تُستخدم في الدرس والمنطقة 3) --- */
function bondHTML(){return`<svg class="bond" viewBox="0 0 360 150"><line class="rope" x1="80" x2="280" y1="75" y2="75"/><circle class="bA" cx="80" cy="75" r="30"/><circle class="bB" cx="280" cy="75" r="30"/><g class="cloud" style="opacity:.3"><ellipse class="cl" cx="180" cy="75" rx="62" ry="28"/><circle class="ed" cx="165" cy="75" r="5"/><circle class="ed" cx="195" cy="75" r="5"/></g><text class="tA" x="80" y="82">؟</text><text class="tB" x="280" y="82">؟</text><text class="dl dA" x="80" y="26"></text><text class="dl dB" x="280" y="26"></text></svg>`}
function btype(d){return d<0.4?{k:'np',t:'تساهمية غير قطبية (Nonpolar covalent)'}:d<=1.7?{k:'p',t:'تساهمية قطبية (Polar covalent)'}:{k:'i',t:'أيونية (Ionic)'}}
function bondUpd(rt,A,B){const q=s=>$(s,rt);
 const ra=a=>a?Math.round(20+a.r*.1):26;
 [['bA',A],['bB',B]].forEach(([c,a])=>{const n=q('.'+c);n.setAttribute('r',ra(a));n.style.fill=a?`hsl(${hue(a)} 70% 50%)`:'var(--panel2)'});
 q('.tA').textContent=A?A.s:'؟';q('.tB').textContent=B?B.s:'؟';
 const cl=q('.cloud'),mk=$$('.escale .mk',rt);
 if(mk.length){mk[0].style.left=(A&&A.en!=null?A.en/4*100:-10)+'%';mk[1].style.left=(B&&B.en!=null?B.en/4*100:-10)+'%'}
 if(!A||!B||A.en==null||B.en==null){cl.style.opacity=.15;q('.dA').textContent='';q('.dB').textContent='';return null}
 const d=Math.abs(A.en-B.en),dir=B.en>A.en?1:-1,t=btype(d),hi=B.en>=A.en?B:A;

  if(Z5.inv.length==8)say('جمعت كل العيّنات! اذهب إلى المحطات في الصف السفلي ⚡🧠🧱');}
 const st=Object.keys(Z5T).find(k=>Z5T[k].p[0]==Z5.x&&Z5T[k].p[1]==Z5.y);
 if(st){if(Z5.tasks[st]){fb('✨ هذه المحطة تعمل بالفعل.','good');return}
  if(Z5.inv.length<8){fb(`🔒 اجمع كل العيّنات أولًا (${Z5.inv.length}/8).`,'warn');return}
  Z5.at=st;const T=Z5T[st];$('#tp').innerHTML=`<div class="card" style="background:var(--panel2)"><h3>${T.ic} ${T.n}</h3><p>${T.need}</p><div class="tslot drop" id="tslot">اسحب عيّنة من حقيبتك إلى هنا (أو اضغطها)</div></div>`;$('#tp').scrollIntoView({behavior:'smooth',block:'nearest'});z5inv()}
 else{Z5.at=null;$('#tp').innerHTML=Object.keys(Z5.tasks).length==3?'':''; if(Object.keys(Z5.tasks).length==3)z5rank()}}
function z5go(x,y){if(Z5.busy)return;
 const key=(a,b)=>a+','+b,blocked=(a,b)=>Z5R.some(r=>r[0]==a&&r[1]==b),q=[[Z5.x,Z5.y]],prev={[key(Z5.x,Z5.y)]:null};
 while(q.length){const[a,b]=q.shift();if(a==x&&b==y)break;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const na=a+dx,nb2=b+dy;if(na<0||nb2<0||na>7||nb2>5||blocked(na,nb2)||key(na,nb2)in prev)continue;prev[key(na,nb2)]=[a,b];q.push([na,nb2])}}
 if(!(key(x,y)in prev)||(x==Z5.x&&y==Z5.y))return;
 const path=[];let c=[x,y];while(c&&!(c[0]==Z5.x&&c[1]==Z5.y)){path.unshift(c);c=prev[key(c[0],c[1])]}
 Z5.busy=true;let i=0;const iv=setInterval(()=>{if(cur!=='z5'||i>=path.length){clearInterval(iv);Z5.busy=false;return}Z5.x=path[i][0];Z5.y=path[i][1];i++;z5robot();if(i==path.length){clearInterval(iv);Z5.busy=false;z5land()}},150)}
function z5task(s){const st=Z5.at,T=Z5T[st],e=E[s];
 if(T.ok(s)){Z5.tasks[st]=1;sfx('win');addXP(20);Z5.at=null;$('#tp').innerHTML='';z5draw();fb(`✅ <b>${e.n}</b> مناسب! ${T.msg}<br>🌍 عاد جزء من الألوان والطاقة إلى العالم!`,'good');if(Object.keys(Z5.tasks).length==3){say('بقي ترتيب العناصر حسب الصفة الفلزية!');z5rank()}}
 else{sfx('bad');shake($('#tslot'));const k=kind(e);fb(`❌ <b>${e.n}</b> (${k}) ليس مناسبًا هنا. ${st=='g'?'ابحث عن عنصر أكثر فلزية: صفة الفلزية تزداد نزولًا في المجموعة ونحو اليسار.':st=='h'?(k=='فلز'?'هذا فلز موصل جدًا، والرقاقة تحتاج شبه موصل على الحد الفاصل.':'هذا لا فلز لا يوصل. ابحث عن العنصر على حدّ السلّم.'):(k=='فلز'?'الفلزات توصل الكهرباء ولا تصلح للعزل.':k=='شبه فلز'?'شبه الفلز يوصل جزئيًا، والمطلوب عازل تمامًا.':'هذا لا فلز لكن الحالة الفيزيائية تهم: المطلوب مادة صلبة.')}`,'bad')}}
function z5rank(){const done=Z5.seq.length==8&&!Z5.fin;
 $('#tp').innerHTML=`<div class="card" style="background:var(--panel2)"><h3>🏆 لوحة الترتيب النهائية</h3><p class="task">رتّب العيّنات من <b>الأقل</b> إلى <b>الأكثر</b> صفةً فلزية: اضغط عيّنة من حقيبتك لتضعها في التسلسل بالترتيب.</p><div class="seq drop" id="seq">${Z5.seq.map(s=>`<div class="tok" style="--h:${hue(E[s])}"><b>${s}</b></div>`).join('')}</div></div>`;
 $$('#inv .tok').forEach(t=>t.style.opacity=Z5.seq.includes(t.dataset.s)?.25:1);
 if(done)z5fin()}
function z5pick(s){if(Z5.seq.includes(s))return;const exp=Z5ORD[Z5.seq.length];
 if(s===exp){Z5.seq.push(s);sfx('good');addXP(5);fb(`✅ ${E[s].n} في مكانه.`,'good');z5rank()}
 else{sfx('bad');const e=E[s],x=E[exp];fb(`❌ ليس بعد. تذكّر: الصفة الفلزية <b>تقل نحو اليمين</b> في الدورة و<b>تزداد نزولًا</b> في المجموعة. ${e.s} (م${e.g}، د${e.p}). هل هو الأقل فلزية بين المتبقّي؟ 🤔`,'bad');shake($('#seq'))}}
function z5fin(){Z5.fin=true;sfx('win');fb('🎉 رتّبت الكل: Cl ‹ S ‹ Si ‹ Al ‹ Mg ‹ Na ‹ K ‹ Cs. عاد العالم لألوانه!','good');
 setTimeout(()=>finish('z5',40,'استعدت العناصر!','تعلّمت أن الصفة الفلزية <b>تقل عبر الدورة</b> و<b>تزداد نزولًا في المجموعة</b>، وأن أشباه الفلزات على الحد الفاصل. تُفتح الآن «المفاعل النهائي»!'),700)}
function z5hint(){Z5.hint++;const t=Z5.inv.length<8?'اجمع العيّنات المتوهجة بالمرور عليها أو بالضغط على مربعها.':Object.keys(Z5.tasks).length<3?'الفلز الأقوى في أسفل المجموعة 1، وشبه الفلز على الحد الفاصل بين الفلزات واللافلزات، والعازل لا فلز صلب.':'الأقل فلزية في الأعلى واليمين (Cl)، والأكثر في الأسفل واليسار (Cs).';fb('💡 '+t,'hint');say(t)}
document.addEventListener('keydown',e=>{if(cur!=='z5'||!Z5)return;const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];if(m){e.preventDefault();z5step(m)}});

/* ================= المفاعل النهائي ================= */
const RX=[
 {id:'a',ic:'🛡️',t:'الدرع',desc:'عنصر من <b>المجموعة 1</b> له <b>أكبر نصف قطر ذري</b>.',p:'r',sc:e=>e.g==1,mode:'max',scn:'المجموعة 1',tr:'نصف القطر يزداد نزولًا في المجموعة.'},
 {id:'b',ic:'🔥',t:'المُشعل',desc:'عنصر من <b>المجموعة 2</b> يحتاج <b>أقل طاقة تأين</b> أولى.',p:'ie',sc:e=>e.g==2,mode:'min',scn:'المجموعة 2',tr:'طاقة التأين تقل نزولًا في المجموعة.'},
 {id:'c',ic:'🧲',t:'المغناطيس',desc:'أعلى <b>كهروسالبية</b> في الجدول كله.',p:'en',sc:()=>true,mode:'max',scn:'الجدول كله',tr:'الكهروسالبية تزداد نحو اليمين وللأعلى.'},
 {id:'d',ic:'🔋',t:'المستقبِل',desc:'من <b>الدورة 3</b>: يُطلق <b>أكبر طاقة</b> عند اكتساب إلكترون (أكبر ألفة إلكترونية).',p:'ea',sc:e=>e.p==3,mode:'max',scn:'الدورة 3',tr:'الألفة تزداد نحو اليمين، لكن احذر الغازات النبيلة.'},
 {id:'e',ic:'🔌',t:'الموصل',desc:'أعلى <b>صفة فلزية</b> في <b>الدورة 4</b>.',p:'mc',sc:e=>e.p==4,mode:'max',scn:'الدورة 4',tr:'الصفة الفلزية تزداد نحو اليسار.'}];
let Rx;
function rx(){Rx={act:0,ok:{},bad:null,hint:0,fin:false};hintFn=rxhint;rxdraw();say('اسحب العناصر من الجدول إلى وحدات المفاعل. القرار الخاطئ يُربك المفاعل، لكن يمكنك المحاولة 🔁')}
function rxdraw(){const n=Object.keys(Rx.ok).length,m=RX[Rx.act];
 app.innerHTML=`<div class="zhead"><span>☢️ تحدي المفاعل النهائي</span><span class="pill">${n}/5 مستقر</span></div>
 <div class="card"><div class="core ${n==5?'up':''}" id="core" style="--g:${n}"><div class="ring r1"></div><div class="ring r2"></div><div class="nuc2">${n==5?'✨':'⚠️'}</div></div>
 <div class="mods">${RX.map((q,i)=>`<button class="mod drop ${Rx.ok[q.id]?'ok':''} ${Rx.act==i?'act':''} ${Rx.bad&&Rx.bad.id==q.id?'bad':''}" data-k="${i}"><span>${q.ic}</span><b>${Rx.ok[q.id]||(Rx.bad&&Rx.bad.id==q.id?Rx.bad.s:'؟')}</b>${q.t}</button>`).join('')}</div>
 <div class="cond"><b>${m.ic} ${m.t}:</b> ${m.desc}</div></div>
 <div class="card"><p class="mini">اسحب عنصرًا إلى وحدة، أو اضغط عنصرًا ليدخل الوحدة المحددة.</p><div class="scr"><div class="tw" style="padding:0">${ptHTML(null)}</div></div><div id="fb" class="fb">المفاعل غير مستقر. ابدأ بالوحدة المحددة 👆</div><div class="row"><button class="btn ghost" id="hb">💡 تلميح</button></div></div>`;
 $$('.mod').forEach(b=>b.onclick=()=>{Rx.act=+b.dataset.k;Rx.bad=null;rxdraw()});
 $$('.cell').forEach(c=>drag(c,c.dataset.s,{onDrop:(s,t)=>{if(t.dataset.k!=null)rxplace(s,+t.dataset.k)},onTap:s=>rxplace(s,Rx.act)}));
 $('#hb').onclick=rxhint}
function rxeval(m,e){
 if(!m.sc(e))return{ok:false,msg:`<b>${e.n}</b> خارج نطاق الشرط (${m.scn}).`};
 const pool=ELS.filter(x=>m.sc(x)&&val(m.p,x)!=null),best=pool.reduce((a,b)=>(m.mode=='max'?val(m.p,b)>val(m.p,a):val(m.p,b)<val(m.p,a))?b:a);
 if(e.s==best.s)return{ok:true,best};
 const v=PR[m.p].show(e),dir=best.p>e.p?'نحو الأسفل':best.p<e.p?'نحو الأعلى':best.g<e.g?'نحو اليسار':'نحو اليمين';
 return{ok:false,msg:`<b>${e.n}</b>: ${PR[m.p].ar} = ${v}، لكن في النطاق عنصرًا ${m.mode=='max'?'أعلى':'أقل'} منه. ابحث ${dir} داخل ${m.scn}. ${m.tr}`}}
function rxplace(s,i){if(Rx.fin)return;const m=RX[i],e=E[s];if(Rx.ok[m.id]){fb('هذه الوحدة مستقرة بالفعل ✅','warn');return}
 const r=rxeval(m,e);Rx.act=i;
 if(r.ok){Rx.ok[m.id]=s;Rx.bad=null;sfx('good');addXP(15);rxdraw();const n=Object.keys(Rx.ok).length;
  fb(`✅ <b>${e.n}</b> مناسب! ${m.desc.replace(/<\/?b>/g,'')} (${PR[m.p].show(e)})`,'good');
  if(n==5){Rx.fin=true;say('المفاعل يعمل! ✨');setTimeout(()=>{sfx('win');confetti();finish('rx',100,'أُعيد تشغيل المفاعل!','عادت الألوان والحركة إلى عالم العناصر بفضل فهمك للاتجاهات الدورية.');},1400)}}
 else{Rx.bad={id:m.id,s};sfx('bad');rxdraw();shake($('#core'));fb('❌ '+r.msg+' <br><small>اختلّ استقرار المفاعل لحظيًا… حاول مجددًا.</small>','bad');setTimeout(()=>{if(cur==='rx'&&Rx.bad&&Rx.bad.s==s){Rx.bad=null;const mk=$(`.mod[data-k="${i}"]`);if(mk){mk.classList.remove('bad');mk.querySelector('b').textContent='؟'}}},2200)}}
function rxhint(){Rx.hint++;const m=RX[Rx.act],pool=ELS.filter(x=>m.sc(x)&&PR[m.p].get(x)!=null),best=pool.reduce((a,b)=>(m.mode=='max'?val(m.p,b)>val(m.p,a):val(m.p,b)<val(m.p,a))?b:a);
 const t=Rx.hint%3==1?m.tr:Rx.hint%3==2?`ابحث داخل: ${m.scn}.`:`الجواب في الدورة رقم ${best.p}.`;fb('💡 '+t,'hint');say(t)}

/* ================= شاشة الفوز ================= */
function win(){cur='win';hintFn=null;
 app.innerHTML=`<div class="hero"><div style="font-size:4rem">🌟⚛️🌟</div><h1 style="font-size:2.2rem">عاد عالم العناصر!</h1><p>أعدت تشغيل مفاعل الجدول الدوري. هذه المهارات التي أتقنتها:</p>
 <div class="card"><ul class="skills"><li>🌳 نصف القطر الذري يقل عبر الدورة ويزداد نزولًا في المجموعة</li><li>⚡ طاقة التأين تزداد عبر الدورة وتقل نزولًا، مع استثناءات</li><li>🧲 الكهروسالبية تحدد اتجاه الإلكترونات ونوع الرابطة</li><li>🔬 الألفة الإلكترونية لها استثناءات بسبب الأغلفة الفرعية والتنافر</li><li>🏁 الصفة الفلزية تقل عبر الدورة وتزداد نزولًا</li></ul><b>⭐ نقاط الخبرة: ${S.xp}</b></div>
 <div class="row" style="justify-content:center"><button class="btn" id="mp">🗺 العودة للخريطة</button><button class="btn ghost" id="ag">↺ ابدأ من جديد</button></div></div>`;
 $('#mp').onclick=()=>go('map');$('#ag').onclick=()=>{S={xp:0,done:{},lessonsDone:false,muted:S.muted};save();go('start')};confetti()}

/* ================= التنقل والتشغيل ================= */
const SCR={start,lessons:lessonsGo,map,z1,z2,z3,z4,z5,rx,win};
function go(n){hintFn=null;closeModal();$('#bubble').classList.remove('on');cur=n;$('#top').classList.toggle('hidden',n==='start');window.scrollTo(0,0);SCR[n]();updTop()}
$('#mascot').onclick=()=>{if(hintFn)hintFn();else say('اضغط «ابدأ المغامرة» أو اختر منطقة من الخريطة!')};
$('#bMap').onclick=()=>{if(!S.lessonsDone)return toast('أكمل الدروس أولًا 📖');go('map')};
$('#bLes').onclick=()=>{L.i=0;go('lessons')};
$('#bSnd').onclick=()=>{S.muted=!S.muted;save();updTop()};
(function(){const b=$('#bgat');for(let i=0;i<9;i++){const d=document.createElement('i'),s=40+Math.random()*120;d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:-${Math.random()*14}s`;b.appendChild(d)}})();
updTop();go('start');

</script>
